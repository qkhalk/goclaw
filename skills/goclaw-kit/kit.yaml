name: goclaw-kit
version: 1.1.0
description: >-
  The GoClaw kit — the full bundled skill suite shipped with the gateway,
  split into two sub-kits: goclaw-engineer (build & operate software) and
  goclaw-marketing (content, creative and business). The goclaw-kit
  meta-skill (in this directory) is the entry point that maps tasks to
  skills and chains them.
kits:
  - goclaw-engineer
  - goclaw-marketing
